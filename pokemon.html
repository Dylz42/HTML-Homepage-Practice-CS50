        <!-- BODY -->
        <!-- This is the main body, here the main content, the favourite pokemon are listed -->
         <main>
        <h2>These are my Top 3 Favourite Pokemon</h2>
        <div id="pokemon-div" class="pokemon-div"></div>
         </main>

         <script>
            const pokemon = [
                "palafin-hero",
                "Sneasel",
                "Typhlosion-hisui"
            ];

            async function getPokemon(name){
                const url = `https://pokeapi.co/api/v2/pokemon/${name}`;
                const response = await fetch(url);
                if (!response.ok) {
                    console.error(`Could not find $(name)`);
                    return;
                }

                const pokemon = await response.json();

                displayPokemon(pokemon);
            }

            function displayPokemon(pokemon){
                const div = document.getElementById("pokemon-div");

                const card = document.createElement("div");
                card.classList.add("pokemon-card");

                const abilities = pokemon.abilities.map(item => item.ability.name.replace("-", " ")).join(", ");

                card.innerHTML = `
                <h3 class="pokemon-name">${pokemon.name}</h3>

                <img src="${pokemon.sprites.other["official-artwork"].front_default}" alt = "${pokemon.name}"></img>

                <h4>Abilities</h4>

                <p class="ability">${abilities}</p>
                `;

                div.appendChild(card);

            }

            pokemon.forEach(name => {
                getPokemon(name);
            });
         </script>
